# 生产形态：一个容器里的 Node.js 同时提供 dist、/api 和 /ws，
# 每个房间再 fork 一个 room-worker.mjs 子进程。
services:
  skyland:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyland:latest
    container_name: skyland
    restart: unless-stopped
    # 房间 DS 是子进程。PID 1 是 node 而不是 init 时，被回收的子进程会留成僵尸，
    # 所以交给 docker-init 来收养。
    init: true
    ports:
      # 默认只发布到回环。纯 HTTP 直连公网是跑不起来的——没有安全上下文就没有
      # SharedArrayBuffer，客户端会直接抛「渲染循环搬不进线程」，见
      # doc/docker-deployment.md 4.1。要 HTTPS 就用下面的 tls profile。
      # 真要临时对外裸跑（只够验 /api/health）：SKYLAND_PUBLISH=0.0.0.0:80
      - "${SKYLAND_PUBLISH:-127.0.0.1:3090}:3090"
    environment:
      SKYLAND_SERVER_HOST: 0.0.0.0
      SKYLAND_SERVER_PORT: "3090"
      SKYLAND_WEB_ROOT: /app/dist
    volumes:
      # 调试用的 PlayerTransform 日志，容器重建后仍然留着。
      - skyland-logs:/app/logs
    # 健康检查沿用镜像里的 HEALTHCHECK：它按 SKYLAND_SERVER_PORT 取端口，
    # 在这里重写一份就会把端口写死。

  # 可选的 TLS 入口，只在 --profile tls 时启动：
  #   SKYLAND_SITE=111.229.172.59.sslip.io docker compose --profile tls up -d
  # Caddy 自动向 Let's Encrypt 申请并续期证书，需要 80 和 443 都能从公网访问
  # （80 是 HTTP-01 挑战用的，签完会 301 到 443）。
  caddy:
    image: caddy:2-alpine
    container_name: skyland-caddy
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 用 :- 而不是 :?——后者在没启用 tls profile 时也会求值，把普通的
      # docker compose up 一起弄失败。占位值签不出证书，Caddy 会明确报出来。
      SKYLAND_SITE: ${SKYLAND_SITE:-skyland-site-not-set.invalid}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书和账户密钥。丢了会重新签，Let's Encrypt 有频率限制，务必持久化。
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - skyland

  # 另一个 TLS 入口，用 nginx，证书自己准备（自签或已有的）：
  #   ./deploy/generate-self-signed-cert.sh 111.229.172.59
  #   docker compose --profile nginx-tls up -d
  # 和 caddy 二选一，两个都占 80/443，不能同时起。
  nginx:
    image: nginx:1.27-alpine
    container_name: skyland-nginx
    profiles: ["nginx-tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - skyland

  # 第三条路：Cloudflare 快速隧道。只建立出站连接，不监听任何入站端口，
  # 所以不受未备案域名拦截和安全组的影响，拿到的是 Cloudflare 的正式证书。
  #   docker compose --profile quicktunnel up -d
  #   docker compose logs cloudflared | grep trycloudflare.com
  # 地址是随机的，每次重启都会变，且带宽有限——用来试玩和分享，不是正式形态。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skyland-tunnel
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://skyland:3090
    depends_on:
      - skyland

volumes:
  skyland-logs:
  caddy-data:
  caddy-config:
