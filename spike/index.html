<!doctype html>
<html><head><meta charset="utf-8"><title>render worker spike</title></head>
<body style="margin:0">
<canvas id="c" width="960" height="540"></canvas>
<pre id="log" style="font:12px monospace"></pre>
<script type="module">
import { RenderTransformBuffer } from '../src/render/RenderTransformBuffer.ts';
import { RenderProxyTable } from '../src/render/RenderProxyTable.ts';
import { RenderCommandQueue } from '../src/render/worker/renderCommands.ts';

const log = document.getElementById('log');
const write = (t) => { log.textContent += t + '\n'; };
const canvas = document.getElementById('c');
const offscreen = canvas.transferControlToOffscreen();
const worker = new Worker(new URL('./renderWorker.worker.ts', import.meta.url), { type: 'module' });

// 主线程这一侧：只有命令队列和那段字节，**一个 Three 对象都没有**。
const transforms = new RenderTransformBuffer(64);
const queue = new RenderCommandQueue();
const proxyIds = new RenderProxyTable(queue);

worker.addEventListener('message', (e) => {
  const { stage, ok, detail } = e.data;
  write(`${ok ? 'OK  ' : 'FAIL'} ${stage}${detail ? ' — ' + detail : ''}`);
  if (!ok) { window.__spikeDone = true; return; }
  if (stage === 'ready') drive();
  if (stage === 'applied-batch') window.__spikeDone = true;
});
worker.addEventListener('error', (e) => {
  write(`FAIL worker-error — ${e.message}`);
  window.__spikeDone = true;
});

worker.postMessage({ canvas: offscreen, bytes: transforms.bytes }, [offscreen]);

function drive() {
  const crate = {
    model: 'line-art-cargo-crate',
    color: '#a07850', accentColor: '#6f5138', length: 1.2, width: 1.2, height: 1,
  };
  for (let i = 0; i < 3; i += 1) {
    const id = proxyIds.acquire();
    queue.createMeshProxy(id, { name: `spike-crate-${i}`, render: crate, interactionMarker: true });
    transforms.write(id, i * 2.2 - 2.2, 0.5, 0, i * 0.4);
  }
  const slimeId = proxyIds.acquire();
  queue.createPlayerProxy(slimeId, {
    name: 'spike-slime', walkSpeed: 3,
    render: {
      model: 'line-art-player-slime', radius: 0.6,
      membraneColor: '#bfe8dd', middleColor: '#a8ddd0', coreColor: '#7fc9b8',
      bubbleColor: '#ffffff', inkColor: '#3d5c55', shadowColor: '#cfd8d4',
    },
  });
  transforms.write(slimeId, 0, 0.6, 3.5, 0);
  queue.setInteractionMarker(0, '拾取');
  for (let cz = -1; cz <= 0; cz += 1) {
    for (let cx = -1; cx <= 0; cx += 1) {
      queue.mount({ key: `${cx}:${cz}`, chunkX: cx, chunkZ: cz, terrainOverrides: new Int32Array() });
    }
  }
  transforms.publish();
  queue.submitTransforms(transforms);
  queue.updateVisuals(transforms, 1 / 60, 0);

  const batch = queue.flush();
  write(`--> 发出 ${batch.commands.length} 条命令，转移 ${batch.transfer.length} 段缓冲`);
  worker.postMessage({ batch }, batch.transfer);
}
</script>
</body></html>
