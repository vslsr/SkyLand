<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfbf6" />
    <title>SkyLand · 线稿小景</title>
  </head>
  <body>
    <main id="app-shell" class="app-shell">
      <section id="game-layer" class="game-layer" aria-label="游戏交互层">
        <canvas id="scene" aria-label="SkyLand 线稿树林场景"></canvas>

        <button
          id="game-menu-button"
          class="game-menu-launcher"
          type="button"
          aria-label="打开游戏菜单"
          aria-haspopup="dialog"
          hidden
        >•••</button>

        <header class="hud hud--header">
          <span class="style-badge">
            <strong id="room-label">未连接房间</strong>
            <i></i>
            <span id="room-population">OFFLINE</span>
          </span>
        </header>

        <div class="hud hud--footer">
          <span id="lock-hint">点击画面控制镜头</span>
        </div>

        <div id="crosshair" class="crosshair" aria-hidden="true"></div>

        <div id="virtual-controls" class="virtual-controls" aria-label="触摸控制">
          <div
            id="virtual-move-stick"
            class="virtual-stick"
            role="group"
            aria-label="移动摇杆"
          >
            <span class="virtual-stick__guide" aria-hidden="true"></span>
            <span id="virtual-move-stick-knob" class="virtual-stick__knob" aria-hidden="true"></span>
          </div>

          <div class="virtual-buttons">
            <button
              id="virtual-sprint-button"
              class="virtual-button virtual-button--sprint"
              type="button"
              aria-label="加速"
            >RUN</button>
            <button
              id="virtual-interact-button"
              class="virtual-button"
              type="button"
              aria-label="长按交互"
            >HOLD</button>
            <button
              id="virtual-dodge-button"
              class="virtual-button"
              type="button"
              aria-label="双击闪避"
            >2×</button>
          </div>
        </div>
      </section>

      <div id="common-ui-root" class="common-ui-root" aria-label="通用界面层"></div>
      <div id="webgl-error" class="error-panel" hidden>
        当前浏览器无法创建 WebGL 上下文，请更新显卡驱动或使用新版浏览器。
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
