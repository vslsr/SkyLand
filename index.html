<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfbf6" />
    <title>SkyLand · 线稿小景</title>
  </head>
  <body>
    <main id="app-shell" class="app-shell">
      <section id="game-layer" class="game-layer" aria-label="游戏交互层">
        <canvas id="scene" aria-label="SkyLand 线稿树林场景"></canvas>

        <!-- 触摸控制是游戏层输入：紧贴画布放在所有 UI 之前，让 UI 先吃掉指针。 -->
        <div id="virtual-controls" class="virtual-controls" aria-label="触摸控制"></div>

        <button
          id="game-menu-button"
          class="game-menu-launcher"
          type="button"
          aria-label="打开游戏菜单"
          aria-haspopup="dialog"
          hidden
        >•••</button>

        <header class="hud hud--header">
          <span class="style-badge">
            <strong id="room-label">未连接房间</strong>
            <i></i>
            <span id="room-population">OFFLINE</span>
          </span>
        </header>

        <aside id="vessel-status" class="vessel-status" aria-label="木筏状态" hidden>
          <strong>VESSEL</strong>
          <span id="vessel-speed">航速 0.0 m/s</span>
          <span id="vessel-load">载重 0 kg</span>
          <span id="vessel-condition">状态 正常</span>
          <span id="vessel-event" class="vessel-status__event"></span>
        </aside>

        <aside id="terrain-editor" class="terrain-editor" aria-label="地形编辑" hidden>
          <button
            id="terrain-editor-toggle"
            class="terrain-editor__tab"
            type="button"
            aria-expanded="false"
            aria-controls="terrain-editor-tools"
            title="地形编辑"
          ></button>
          <div id="terrain-editor-tools" class="terrain-editor__tools" role="group" hidden></div>
        </aside>

        <aside id="build-editor" class="build-editor" aria-label="建造" hidden>
          <button
            id="build-editor-toggle"
            class="build-editor__tab"
            type="button"
            aria-expanded="false"
            aria-controls="build-editor-tools"
            title="建造"
          ></button>
          <div id="build-editor-tools" class="build-editor__tools" role="group" hidden></div>
        </aside>

        <div id="death-notice" class="death-notice" role="status" hidden>
          <strong>你已阵亡</strong>
          <span>相机已切换为自由视角</span>
        </div>

        <div id="interaction-prompt" class="interaction-prompt" hidden></div>

        <div id="health-root" class="health-root"></div>

        <div id="hotbar-root" class="hotbar-root"></div>

        <div id="crosshair" class="crosshair" aria-hidden="true"></div>
      </section>

      <div id="common-ui-root" class="common-ui-root" aria-label="通用界面层"></div>
      <div id="webgl-error" class="error-panel" hidden>
        客户端初始化失败，请刷新页面后重试。
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
