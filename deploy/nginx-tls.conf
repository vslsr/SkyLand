# nginx 在这里只做一件事：终止 TLS，把请求原样交给 skyland 容器的 3090。
#
# 不要在这里写任何 add_header / proxy_hide_header：COOP、COEP、CORP 由
# server/http/crossOriginIsolation.mjs 统一发，nginx 默认会把上游的响应头
# 透传下去。一旦覆盖或删掉，页面就丢了 crossOriginIsolated，客户端会直接抛
# 「拿不到 SharedArrayBuffer」——那正是加这层代理要解决的问题。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # HTTP 一律跳 HTTPS。安全上下文是游戏能不能起来的前提，不留降级入口。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SkyLandTLS:10m;

    # dist 里有 2 MB 的 rapier wasm
    client_max_body_size 16m;

    location / {
        proxy_pass http://skyland:3090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ws 的 WebSocket 升级。写在 location / 里，一并覆盖静态资源和 API。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 游戏会话是长连接，默认 60s 读超时会把闲置连接踢掉。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 快照广播要及时，不能被反代攒着。
        proxy_buffering off;
    }
}
