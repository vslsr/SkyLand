# SkyLand HTTPS entry served by the shared h5sgame nginx container.
# The container must also join the external skyland_default network.
server {
    listen 5050 ssl;
    http2 on;
    server_name _;

    # 浏览器只输入 IP:5050 时通常先发普通 HTTP。Nginx 会将这种请求标成
    # 非标准状态 497，在这里改为跳回同一端口的 HTTPS。
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SkyLandSSL:10m;

    client_max_body_size 16m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $skyland_upstream skyland:3090;

    location / {
        proxy_pass http://$skyland_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
